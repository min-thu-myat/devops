services:
  db:
    image: mysql:8.0
    container_name: semethods-db-1
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: "employees"
    volumes:
      - ./db/test_db:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: semethods-app:latest
    container_name: semethods-app-1
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy