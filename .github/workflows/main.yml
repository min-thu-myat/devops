name: A workflow for my Hello World App

on:
  push:
    branches:
      - master
      - develop
      - main

jobs:
  UnitTests:
    name: Unit Tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Unit Tests
        run: mvn -Dtest=com.napier.devops.AppTest test

  IntegrationTests:
    name: Integration Tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Integration Tests
        run: |
          docker build -t database ./db
          # Added -e MYSQL_ROOT_PASSWORD=example below
          docker run --name employees -e MYSQL_ROOT_PASSWORD=example -dp 33060:3306 database
          
          # Give it a few seconds to see if it stays running
          sleep 10
          
          # Check if container is still running, if not print logs and exit
          if [ ! "$(docker ps -q -f name=employees)" ]; then
              echo "Container died! Printing container logs:"
              docker logs employees
              exit 1
          fi
          
          echo "Waiting for MySQL to be ready..."
          until docker exec employees mysqladmin ping -h"localhost" -uroot -pexample --silent; do
              echo "MySQL is unavailable - sleeping..."
              sleep 3
          done
          
          mvn -Dtest=com.napier.devops.AppIntegrationTest test
          
          docker stop employees
          docker rm employees
          docker image rm database

  build:
    name: Build and Start Using docker-compose
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Package and Run docker compose
        run: |
          mvn package -DskipTests
          docker compose up --abort-on-container-exit