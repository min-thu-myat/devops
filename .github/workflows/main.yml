name: A workflow for my Hello World App

on:
  push:
    branches:
      - master
      - develop
      - main

jobs:
  UnitTests:
    name: Unit Tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Unit Tests
        run: mvn -Dtest=com.napier.devops.AppTest test

  IntegrationTests:
    name: Integration Tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Integration Tests
        run: |
          docker build -t database ./db
          docker run --name employees -e MYSQL_ROOT_PASSWORD=example -dp 33060:3306 database

          echo "Waiting for MySQL to be ready..."
          # Wait until MySQL is accepting connections
          until docker exec employees mysqladmin ping -uroot -pexample --silent; do
            echo "MySQL is unavailable - sleeping..."
            sleep 3
          done

          # Extra wait to make sure the employees database is fully imported
          echo "Waiting for employees database to be imported..."
          until docker exec employees mysql -uroot -pexample -e "USE employees;" 2>/dev/null; do
            echo "Database still importing - sleeping..."
            sleep 3
          done

          echo "Database is ready! Running integration tests..."
          mvn -Dtest=com.napier.devops.AppIntegrationTest test

          docker stop employees
          docker rm employees
          docker image rm database

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          directory: ./target/site/jacoco
          flags: IntegrationTests
          fail_ci_if_error: false
          verbose: true

  build:
    name: Build Run in Docker and Deploy Release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Package and Run docker compose
        run: |
          mvn package -DskipTests
          docker compose up --abort-on-container-exit

      - name: Automatic Releases
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: false
          automatic_release_tag: "latest"
          files: |
            ./target/*.jar